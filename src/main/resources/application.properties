# ===============================
# DATABASE
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/quantity_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# ===============================
# JPA
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${DB_INIT_MODE:update}

# ===============================
# JWT
# ===============================
app.auth.tokenSecret=${APP_AUTH_TOKEN_SECRET}
app.auth.tokenExpirationMsec=${APP_AUTH_TOKEN_EXPIRATION_MSEC:864000000}
app.auth.refreshTokenExpirationMsec=${APP_AUTH_REFRESH_TOKEN_EXPIRATION_MSEC:2592000000}

# ===============================
# OAUTH
# ===============================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

app.oauth2.redirectUri=${APP_OAUTH2_REDIRECT_URI:http://localhost:4200/oauth2/redirect}


spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true