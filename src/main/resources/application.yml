
spring:
  application:
    name: quantity-measurement-app

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:mysql://localhost:3306/quantity_db?useSSL=false&serverTimezone=UTC
    username: root
    password: Adarsh145
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
