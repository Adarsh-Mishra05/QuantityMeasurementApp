        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 660103315435-sp4o56s2ep1dd4bscih1posg4onjk1s3.apps.googleusercontent.com
            client-secret: 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
            scope:
              - email
              - profile
              - openid
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

app:
  oauth2:
    # ✅ Changed from /auth to /oauth2/callback — avoids Vite proxy loop
    redirect-uri: http://localhost:3000/oauth2/callback
  jwt:
    secret: ${APP_JWT_SECRET:VGhpc0lzQVNlY3VyZVNob3VsZEF0TGVhc3QzMkNoYXJhY3RlcnNMb25n}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}

logging:
  level:
    root: INFO
    com.app.quantity_measurement_app: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

management:
